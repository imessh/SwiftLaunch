# ══════════════════════════════════════════════════════════════════════════════
#  SwiftLaunch — CI/CD Pipeline
#  Trigger : push to main
#  Runner  : windows-latest
#  Result  : self-contained EXE → Inno Setup installer → GitHub Release
#
#  Repo structure this file is written for:
#    repo/
#    ├── .github/workflows/ci.yml
#    ├── assets/app.ico
#    ├── installer/setup.iss
#    └── src/swiftlaunch/SwiftLaunch.csproj
# ══════════════════════════════════════════════════════════════════════════════

name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build · Package · Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup .NET 8 SDK ────────────────────────────────────────────────
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      - name: Show repository structure 
        shell: pwsh
        run: |
          Get-Location
          Get-ChildItem -Recurse

      # ── 3. Read version from .csproj ───────────────────────────────────────
      #  csproj lives at: src/swiftlaunch/SwiftLaunch.csproj
      - name: Read version from csproj
        id: read_version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "src\swiftlaunch\SwiftLaunch.csproj"
          $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) {
            Write-Error "Could not read <Version> from SwiftLaunch.csproj"
            exit 1
          }
          $tag = "v$version"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag"         >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $version  (tag: $tag)"

      # ── 4. Guard: skip if tag already exists ──────────────────────────────
      - name: Check if tag already exists
        id: tag_check
        shell: pwsh
        run: |
          $tag = "${{ steps.read_version.outputs.tag }}"
          $exists = git tag --list $tag
          if ($exists) {
            Write-Host "Tag $tag already exists — skipping release."
            Write-Output "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tag $tag is new — proceeding with release."
            Write-Output "skip=false" >> $env:GITHUB_OUTPUT
          }

      # ── 5. Restore NuGet packages ──────────────────────────────────────────
      #  Run from repo root; point at the csproj by path
      - name: Restore dependencies
        if: steps.tag_check.outputs.skip == 'false'
        run: dotnet restore src\swiftlaunch\SwiftLaunch.csproj

      # ── 6. Build (Release) ─────────────────────────────────────────────────
      - name: Build in Release mode
        if: steps.tag_check.outputs.skip == 'false'
        run: |
          dotnet build src\swiftlaunch\SwiftLaunch.csproj `
            --configuration Release `
            --no-restore `
            -p:Platform=x64

      # ── 7. Publish — self-contained single-file EXE ────────────────────────
      #  Output goes to: publish/ at the repo root (predictable path for
      #  setup.iss which references ..\publish\SwiftLaunch.exe from installer/)
      - name: Publish self-contained executable
        if: steps.tag_check.outputs.skip == 'false'
        run: |
          dotnet publish src\swiftlaunch\SwiftLaunch.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Platform=x64 `
            --output publish\

      # ── 8. Install Inno Setup via Chocolatey ──────────────────────────────
      - name: Install Inno Setup
        if: steps.tag_check.outputs.skip == 'false'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          Write-Host "Inno Setup installed."

      # ── 9. Build installer ─────────────────────────────────────────────────
      #  setup.iss is at: installer\setup.iss  (repo root level)
      #  Output will be:  installer\Output\SwiftLaunch-vX.X.X.exe
      - name: Build installer with Inno Setup
        if: steps.tag_check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.read_version.outputs.version }}"
          $iscc    = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"

          & $iscc `
            /DAPP_VERSION=$version `
            installer\setup.iss

          $installer = "installer\Output\SwiftLaunch-v$version.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at: $installer"
            exit 1
          }
          Write-Host "Installer built: $installer"

      # ── 10. Create and push the Git tag ───────────────────────────────────
      - name: Create Git tag
        if: steps.tag_check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $tag = "${{ steps.read_version.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          Write-Host "Pushed tag: $tag"

      # ── 11. Create GitHub Release and upload installer ────────────────────
      - name: Create GitHub Release
        if: steps.tag_check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.read_version.outputs.tag }}
          name:     SwiftLaunch ${{ steps.read_version.outputs.tag }}
          body: |
            ## SwiftLaunch ${{ steps.read_version.outputs.tag }}

            ### Installation
            1. Download **SwiftLaunch-${{ steps.read_version.outputs.tag }}.exe** below.
            2. Run the installer — it will place SwiftLaunch in your Start Menu and register it for Windows startup.
            3. Press **Ctrl+Space** to launch.

            ### What's new
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ---
            _Built automatically from commit ${{ github.sha }}_
          draft:      false
          prerelease: false
          files: installer\Output\SwiftLaunch-v${{ steps.read_version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
